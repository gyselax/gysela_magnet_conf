---
name: Python checks

on:
  pull_request:
    paths:
      - '.github/workflows/python-checks.yaml'
      - '**.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-dependencies:
    name: Python dependency check using deptry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.14'
      - run: pip install deptry
      - name: Analysing the code with deptry
        run: |
          deptry .
